    author: "David Cahn"
    publication: "Sequoia Capital Research"
    date: "2024-06-20"
    url: "https://www.sequoiacap.com/article/ais-600b-question/"
    key_theses:
      - "Estimates the AI revenue run-rate required to pay back GPU data center buildout."
      - "Calculation: If Nvidia hits $150B-$200B data center revenue, and data center GPU capex is ~50% of total buildout (power, cooling, CPUs), total ecosystem capex is $300B-$400B."
      - "Assuming 50% gross margin for end-user AI software, $600B in annual AI software revenue is required to generate a baseline economic return."

