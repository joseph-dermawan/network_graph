  - id: meta_llama3_cluster_reliability
    title: "The Llama 3 Herd of Models"
    author: "Dubey et al. (Meta AI Infrastructure & Fundamental AI Research)"
    publication: "arXiv:2407.21783 [cs.AI]"
    date: "2024-07-23"
    url: "https://arxiv.org/abs/2407.21783"
    key_theses:
      - "Empirical telemetry from a 16,384 NVIDIA H100 (700W) GPU cluster during a continuous 54-day 405B model pre-training run."
      - "Documented 466 total interruptions, of which 419 were unexpected/unplanned (averaging one failure every 3.1 hours)."
      - "Hardware failures caused 78% of all interruptions, with GPUs and HBM3 memory accounting for 58.7% (148 GPU/NVLink faults, 72 HBM3 memory faults), while host CPUs suffered only 2 failures."
      - "Extreme power-draw dynamics: 700W chips cycling between compute and checkpoint flushes create massive thermal/voltage fluctuations and local grid stress."

