  - id: marathon_capital_returns
    title: "Capital Returns: Investing Through the Capital Cycle: A Money Manager's Reports 2002-15"
    author: "Edward Chancellor (Editor), Marathon Asset Management"
    publication: "Palgrave Macmillan"
    date: "2015"
    key_theses:
      - "Capital cycle theory posits that high returns on capital attract excess capital, leading to over-investment, industry overcapacity, falling prices, and collapsing returns."
      - "Investors chronically over-extrapolate current profitability into perpetuity, failing to account for supply response."
      - "The turning point occurs when capital spending slows down, triggering a severe revenue contraction for capital equipment providers."

  - id: sequoia_600b_question
